name: Web regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-chat:
    name: Mobile chat and provider history
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Hang protection for fixtures; normal runtime is under a minute.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:offline
      - name: Browser flows (fixture services only)
        env:
          A0_TEST_ARTIFACT_DIR: test-results
        run: |
          mkdir -p test-results
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/browser.xml tests/frontend/browser.test.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mobile-chat-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
