name: Web regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-chat:
    name: Mobile chat and provider history
    runs-on: ubuntu-24.04 # Playwright 1.56.1 supports this image; latest moved to 26.04.
    timeout-minutes: 10 # Hang protection for fixtures; normal runtime is under a minute.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout the pinned coding-launcher contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: The-Interdependency/skill-lib
          ref: c2002c0f6e24de26299324275da5a0800b0ef26d
          path: contract-skill-lib
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:offline
      - name: Vault provisioning and reliability bridge contracts
        run: |
          node --test tests/reliability/bridge.test.js
          python3 -m unittest discover -s tests/reliability -p "test_*.py"
          python3 tests/reliability/check_launcher_compat.py contract-skill-lib
          for script in operations/install.sh operations/install-vault-tools.sh operations/backup.sh operations/restore.sh operations/rollback.sh; do
            bash -n "$script"
          done
      - name: Browser flows (fixture services only)
        env:
          A0_TEST_ARTIFACT_DIR: test-results
        run: |
          mkdir -p test-results
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/browser.xml tests/frontend/browser.test.js tests/gui/browser.test.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-chat-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
