name: Web regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-chat:
    name: Mobile chat and provider history
    runs-on: ubuntu-22.04
    timeout-minutes: 10 # Hang protection for fixtures; normal runtime is under a minute.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:offline
      - name: Browser flows (fixture services only)
        env:
          A0_TEST_ARTIFACT_DIR: test-results
        run: |
          mkdir -p test-results
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/browser.xml tests/frontend/browser.test.js tests/gui/browser.test.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-chat-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
